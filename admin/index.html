<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WTJ Admin · Reservas</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --negro: #0A0A0A; --bg: #0E0E0E; --bg2: #141414; --bg3: #1A1A1A;
      --verde: #7CB518; --verde2: rgba(124,181,24,0.12); --oro: #C8882A;
      --crema: #F2EDD7; --gris: rgba(242,237,215,0.45);
      --pend: #C8882A; --conf: #7CB518; --canc: #666; --comp: #4a8fd4;
    }
    html, body { height: 100%; background: var(--bg); color: var(--crema); font-family: 'Crimson Pro', serif; }

    /* ── LOGIN ── */
    #loginScreen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--negro);
    }
    .login-box {
      background: var(--bg2);
      border: 1px solid rgba(124,181,24,0.2);
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .login-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 0.1em;
      color: var(--crema);
      line-height: 1;
    }
    .login-logo span { color: var(--verde); }
    .login-sub {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: var(--gris);
      text-transform: uppercase;
      margin: 0.4rem 0 2rem;
    }
    .login-input {
      width: 100%;
      background: var(--bg3);
      border: 1.5px solid rgba(124,181,24,0.2);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: var(--crema);
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      outline: none;
      margin-bottom: 0.9rem;
      transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--verde); }
    .login-btn {
      width: 100%;
      background: var(--verde);
      border: none;
      border-radius: 8px;
      padding: 0.85rem;
      color: var(--negro);
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.3rem;
    }
    .login-btn:hover { background: #8fd11e; }
    .login-btn:disabled { opacity: 0.5; cursor: default; }
    .login-err {
      color: #ff6b6b;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      margin-top: 0.8rem;
    }

    /* ── DASHBOARD ── */
    #dashboard { display: none; min-height: 100vh; }

    /* Header */
    .adm-header {
      background: var(--negro);
      border-bottom: 1px solid rgba(124,181,24,0.12);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .adm-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
    }
    .adm-logo span { color: var(--verde); }
    .adm-logo em { font-style: normal; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--gris); letter-spacing: 0.15em; margin-left: 0.5rem; vertical-align: middle; }
    .adm-user {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--gris);
      display: flex; align-items: center; gap: 1rem;
    }
    .btn-logout {
      background: none;
      border: 1px solid rgba(124,181,24,0.25);
      color: var(--gris);
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--verde); color: var(--verde); }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 1px;
      background: rgba(124,181,24,0.08);
      border-bottom: 1px solid rgba(124,181,24,0.08);
    }
    .stat-card {
      background: var(--negro);
      padding: 1.2rem;
      text-align: center;
    }
    .stat-n {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      color: var(--verde);
      line-height: 1;
    }
    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: var(--gris);
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(124,181,24,0.1);
      background: var(--negro);
    }
    .tab {
      flex: 1;
      background: none;
      border: none;
      padding: 0.9rem 0.5rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--gris);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .tab.active { color: var(--verde); border-bottom-color: var(--verde); }
    .tab:hover:not(.active) { color: var(--crema); }

    /* Week day tabs */
    .week-tabs {
      display: none;
      gap: 0.4rem;
      padding: 0.75rem 1rem;
      background: var(--bg2);
      border-bottom: 1px solid rgba(124,181,24,0.08);
      overflow-x: auto;
    }
    .week-tabs.visible { display: flex; }
    .day-tab {
      flex-shrink: 0;
      background: var(--bg3);
      border: 1.5px solid rgba(124,181,24,0.15);
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: var(--gris);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      line-height: 1.6;
    }
    .day-tab .dt-dia { font-size: 0.75rem; color: var(--crema); display: block; }
    .day-tab:hover:not(.active) { border-color: rgba(124,181,24,0.4); }
    .day-tab.active { border-color: var(--verde); background: var(--verde2); color: var(--verde); }
    .day-tab.active .dt-dia { color: var(--verde); }

    /* Filter */
    .list-header {
      padding: 1rem 1.5rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .list-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.05em;
      color: var(--crema);
    }
    .filter-sel {
      background: var(--bg3);
      border: 1px solid rgba(124,181,24,0.2);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      color: var(--crema);
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      outline: none;
      cursor: pointer;
    }

    /* Reservations */
    #reservasList { padding: 0.5rem 1rem 3rem; }
    .fecha-grupo { margin-bottom: 1.5rem; }
    .fecha-header {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--verde);
      text-transform: uppercase;
      padding: 0.75rem 0.5rem 0.4rem;
      border-bottom: 1px solid rgba(124,181,24,0.12);
      margin-bottom: 0.6rem;
    }
    .reserva-card {
      background: var(--bg2);
      border: 1px solid rgba(124,181,24,0.1);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.6rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0 1rem;
      align-items: start;
      transition: border-color 0.2s;
    }
    .reserva-card:hover { border-color: rgba(124,181,24,0.25); }
    .card-hora {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      color: var(--crema);
      letter-spacing: 0.05em;
      line-height: 1;
      padding-top: 0.15rem;
      min-width: 3.8rem;
    }
    .card-body { min-width: 0; }
    .card-servicio {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--verde);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }
    .card-cliente {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--crema);
      margin-bottom: 0.15rem;
    }
    .card-tel {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--gris);
    }
    .card-tel a { color: inherit; text-decoration: none; }
    .card-tel a:hover { color: var(--verde); }
    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
    .status-badge {
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-pendiente { background: rgba(200,136,42,0.15); color: var(--pend); border: 1px solid rgba(200,136,42,0.3); }
    .badge-confirmada { background: rgba(124,181,24,0.12); color: var(--conf); border: 1px solid rgba(124,181,24,0.3); }
    .badge-cancelada  { background: rgba(100,100,100,0.12); color: var(--canc); border: 1px solid rgba(100,100,100,0.3); }
    .badge-completada { background: rgba(74,143,212,0.12); color: var(--comp); border: 1px solid rgba(74,143,212,0.3); }
    .card-actions { display: flex; flex-direction: column; gap: 0.3rem; align-items: flex-end; }
    .act-btn {
      background: none;
      border: 1px solid;
      border-radius: 5px;
      padding: 0.25rem 0.6rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .act-confirmar { border-color: rgba(124,181,24,0.4); color: var(--conf); }
    .act-confirmar:hover { background: rgba(124,181,24,0.1); }
    .act-cancelar { border-color: rgba(100,100,100,0.4); color: #999; }
    .act-cancelar:hover { background: rgba(100,100,100,0.1); }
    .act-completar { border-color: rgba(74,143,212,0.4); color: var(--comp); }
    .act-completar:hover { background: rgba(74,143,212,0.1); }

    /* Empty / loading */
    .empty-msg {
      text-align: center;
      padding: 3rem 1rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--gris);
    }
    .spinner {
      display: inline-block;
      width: 1.2rem; height: 1.2rem;
      border: 2px solid rgba(124,181,24,0.2);
      border-top-color: var(--verde);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: var(--bg3);
      border: 1px solid rgba(124,181,24,0.3);
      border-radius: 8px;
      padding: 0.7rem 1.4rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--verde);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 500px) {
      .reserva-card { grid-template-columns: auto 1fr; }
      .card-right { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; grid-column: 1/-1; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid rgba(124,181,24,0.08); }
      .card-actions { flex-direction: row; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">WTJ<span>.</span></div>
    <div class="login-sub">Panel de Administración</div>
    <input class="login-input" id="loginEmail" type="email" placeholder="Email" autocomplete="email" />
    <input class="login-input" id="loginPass" type="password" placeholder="Contraseña" autocomplete="current-password" />
    <button class="login-btn" id="loginBtn" onclick="login()">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header class="adm-header">
    <div class="adm-logo">WTJ<span>.</span><em>ADMIN</em></div>
    <div class="adm-user">
      <span id="headerUser"></span>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-n" id="statTotal">—</div>
      <div class="stat-label">Hoy</div>
    </div>
    <div class="stat-card">
      <div class="stat-n" id="statPend">—</div>
      <div class="stat-label">Pendientes</div>
    </div>
    <div class="stat-card">
      <div class="stat-n" id="statConf">—</div>
      <div class="stat-label">Confirmadas</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-vista="hoy" onclick="setVista('hoy',this)">Hoy</button>
    <button class="tab" data-vista="semana" onclick="setVista('semana',this)">Semana</button>
    <button class="tab" data-vista="proximas" onclick="setVista('proximas',this)">Próximas</button>
  </div>

  <div class="week-tabs" id="weekTabs"></div>

  <div class="list-header">
    <div class="list-title" id="listTitle">Reservas de hoy</div>
    <select class="filter-sel" id="filterEstado" onchange="aplicarFiltro()">
      <option value="">Todos los estados</option>
      <option value="pendiente">Pendiente</option>
      <option value="confirmada">Confirmada</option>
      <option value="cancelada">Cancelada</option>
      <option value="completada">Completada</option>
    </select>
  </div>

  <div id="reservasList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  const SUPA_URL = 'https://gimoqpusrdltlkrwsykr.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpbW9xcHVzcmRsdGxrcndzeWtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDA0NDIsImV4cCI6MjA5Nzk3NjQ0Mn0.xmxP3TGAkXNPsrIKSYj1A-NXrIN1JIyzl9Fv6_FP8Dw';
  const db = supabase.createClient(SUPA_URL, SUPA_KEY);

  let vista = 'hoy';
  let diaSeleccionado = hoy();
  let todasReservas = [];

  function hoy() {
    return new Date().toISOString().slice(0, 10);
  }

  /* ── AUTH ── */
  window.login = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    const errDiv = document.getElementById('loginErr');
    const btn = document.getElementById('loginBtn');
    errDiv.textContent = '';
    if (!email || !pass) { errDiv.textContent = 'Introduce email y contraseña.'; return; }
    btn.disabled = true; btn.textContent = 'Entrando...';
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    if (error) {
      errDiv.textContent = 'Email o contraseña incorrectos.';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };

  window.logout = async function() {
    await db.auth.signOut();
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  };

  db.auth.onAuthStateChange((event, session) => {
    if (session) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      const email = session.user.email;
      document.getElementById('headerUser').textContent = email;
      cargarEstadisticas();
      setVista('hoy', document.querySelector('.tab[data-vista="hoy"]'));
    }
  });

  /* ── VISTA ── */
  window.setVista = function(v, btn) {
    vista = v;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const weekTabs = document.getElementById('weekTabs');
    if (v === 'semana') {
      weekTabs.classList.add('visible');
      renderWeekTabs();
    } else {
      weekTabs.classList.remove('visible');
    }
    cargarReservas();
  };

  function renderWeekTabs() {
    const cont = document.getElementById('weekTabs');
    cont.innerHTML = '';
    const ref = new Date();
    const dow = ref.getDay();
    const lunes = new Date(ref);
    lunes.setDate(ref.getDate() - (dow === 0 ? 6 : dow - 1));
    const dias = ['Lun','Mar','Mié','Jue','Vie','Sáb'];
    for (let i = 1; i <= 6; i++) {
      const d = new Date(lunes);
      d.setDate(lunes.getDate() + (i - 1));
      const iso = d.toISOString().slice(0,10);
      const btn = document.createElement('button');
      btn.className = 'day-tab' + (iso === diaSeleccionado ? ' active' : '');
      btn.innerHTML = '<span class="dt-dia">' + dias[i-1] + '</span>' + d.getDate();
      btn.onclick = () => {
        diaSeleccionado = iso;
        document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        cargarReservas();
      };
      if (d.getDay() === 0 || d.getDay() === 1) btn.style.opacity = '0.35';
      cont.appendChild(btn);
    }
  }

  /* ── ESTADÍSTICAS DE HOY ── */
  async function cargarEstadisticas() {
    const { data } = await db.from('reservas').select('estado').eq('fecha', hoy());
    if (!data) return;
    document.getElementById('statTotal').textContent = data.length || '0';
    document.getElementById('statPend').textContent = data.filter(r => r.estado === 'pendiente').length || '0';
    document.getElementById('statConf').textContent = data.filter(r => r.estado === 'confirmada').length || '0';
  }

  /* ── CARGAR RESERVAS ── */
  async function cargarReservas() {
    const list = document.getElementById('reservasList');
    list.innerHTML = '<div class="empty-msg"><div class="spinner"></div><br>Cargando...</div>';
    let query = db.from('reservas')
      .select('*, servicios(nombre, duracion_minutos), clientes(nombre, telefono)')
      .neq('estado', 'deleted');

    const titulo = document.getElementById('listTitle');
    if (vista === 'hoy') {
      query = query.eq('fecha', hoy()).order('hora');
      titulo.textContent = 'Reservas de hoy';
    } else if (vista === 'semana') {
      query = query.eq('fecha', diaSeleccionado).order('hora');
      titulo.textContent = 'Reservas del día';
    } else {
      query = query.gte('fecha', hoy()).order('fecha').order('hora');
      titulo.textContent = 'Próximas reservas';
    }

    const { data, error } = await query;
    if (error) { list.innerHTML = '<div class="empty-msg">Error cargando reservas.</div>'; return; }
    todasReservas = data || [];
    renderLista();
  }

  window.aplicarFiltro = function() { renderLista(); };

  function renderLista() {
    const filtro = document.getElementById('filterEstado').value;
    const list = document.getElementById('reservasList');
    let datos = todasReservas;
    if (filtro) datos = datos.filter(r => r.estado === filtro);
    if (datos.length === 0) {
      list.innerHTML = '<div class="empty-msg">Sin reservas para mostrar.</div>';
      return;
    }
    if (vista === 'proximas') {
      list.innerHTML = '';
      const grupos = {};
      datos.forEach(r => {
        if (!grupos[r.fecha]) grupos[r.fecha] = [];
        grupos[r.fecha].push(r);
      });
      Object.keys(grupos).sort().forEach(fecha => {
        const d = new Date(fecha + 'T00:00:00');
        const label = d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
        const grp = document.createElement('div');
        grp.className = 'fecha-grupo';
        grp.innerHTML = '<div class="fecha-header">' + label.charAt(0).toUpperCase() + label.slice(1) + '</div>';
        grupos[fecha].forEach(r => grp.appendChild(crearCard(r)));
        list.appendChild(grp);
      });
    } else {
      list.innerHTML = '';
      datos.forEach(r => list.appendChild(crearCard(r)));
    }
  }

  function crearCard(r) {
    const card = document.createElement('div');
    card.className = 'reserva-card';
    card.id = 'card-' + r.id;
    const hora = r.hora ? r.hora.slice(0,5) : '—';
    const servicio = r.servicios ? r.servicios.nombre : '—';
    const duracion = r.servicios ? r.servicios.duracion_minutos + 'min' : '';
    const clienteNombre = r.clientes ? (r.clientes.nombre || 'Sin nombre') : 'Sin nombre';
    const clienteTel = r.clientes ? r.clientes.telefono : '';
    const telHref = clienteTel ? 'tel:' + clienteTel.replace(/\s/g,'') : '#';
    const badgeClass = 'badge-' + r.estado;

    let acciones = '';
    if (r.estado === 'pendiente') {
      acciones = '<button class="act-btn act-confirmar" onclick="cambiarEstado(\'' + r.id + '\',\'confirmada\')">Confirmar</button>' +
                 '<button class="act-btn act-cancelar" onclick="cambiarEstado(\'' + r.id + '\',\'cancelada\')">Cancelar</button>';
    } else if (r.estado === 'confirmada') {
      acciones = '<button class="act-btn act-completar" onclick="cambiarEstado(\'' + r.id + '\',\'completada\')">Completada</button>' +
                 '<button class="act-btn act-cancelar" onclick="cambiarEstado(\'' + r.id + '\',\'cancelada\')">Cancelar</button>';
    } else if (r.estado === 'cancelada') {
      acciones = '<button class="act-btn act-confirmar" onclick="cambiarEstado(\'' + r.id + '\',\'pendiente\')">Reactivar</button>';
    }

    card.innerHTML =
      '<div class="card-hora">' + hora + '</div>' +
      '<div class="card-body">' +
        '<div class="card-servicio">' + servicio + (duracion ? ' · ' + duracion : '') + '</div>' +
        '<div class="card-cliente">' + clienteNombre + '</div>' +
        (clienteTel ? '<div class="card-tel"><a href="' + telHref + '">' + clienteTel + '</a></div>' : '') +
      '</div>' +
      '<div class="card-right">' +
        '<span class="status-badge ' + badgeClass + '">' + r.estado + '</span>' +
        '<div class="card-actions">' + acciones + '</div>' +
      '</div>';
    return card;
  }

  /* ── CAMBIAR ESTADO ── */
  window.cambiarEstado = async function(id, nuevoEstado) {
    const { error } = await db.from('reservas').update({ estado: nuevoEstado }).eq('id', id);
    if (error) { mostrarToast('Error al actualizar.'); return; }
    todasReservas = todasReservas.map(r => r.id === id ? { ...r, estado: nuevoEstado } : r);
    renderLista();
    cargarEstadisticas();
    const labels = { confirmada: '✓ Confirmada', cancelada: '✗ Cancelada', completada: '✓ Completada', pendiente: 'Reactivada' };
    mostrarToast(labels[nuevoEstado] || nuevoEstado);
  };

  /* ── TOAST ── */
  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  /* ── AUTO-REFRESH ── */
  setInterval(() => {
    cargarEstadisticas();
    cargarReservas();
  }, 60000);
})();
</script>
