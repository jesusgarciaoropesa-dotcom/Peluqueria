<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WTJ Admin · Reservas</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --negro: #0A0A0A; --bg: #0E0E0E; --bg2: #141414; --bg3: #1A1A1A; --bg4: #202020;
      --verde: #7CB518; --verde2: rgba(124,181,24,0.12); --oro: #C8882A;
      --crema: #F2EDD7; --gris: rgba(242,237,215,0.45);
      --pend: #C8882A; --conf: #7CB518; --canc: #666; --comp: #4a8fd4;
    }
    html, body { height: 100%; background: var(--bg); color: var(--crema); font-family: 'Crimson Pro', serif; }

    /* ── LOGIN ── */
    #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--negro); }
    .login-box { background: var(--bg2); border: 1px solid rgba(124,181,24,0.2); border-radius: 14px; padding: 2.5rem 2rem; width: 100%; max-width: 360px; text-align: center; }
    .login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 0.1em; color: var(--crema); line-height: 1; }
    .login-logo span { color: var(--verde); }
    .login-sub { font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 0.18em; color: var(--gris); text-transform: uppercase; margin: 0.4rem 0 2rem; }
    .login-input { width: 100%; background: var(--bg3); border: 1.5px solid rgba(124,181,24,0.2); border-radius: 8px; padding: 0.8rem 1rem; color: var(--crema); font-family: 'Crimson Pro', serif; font-size: 1rem; outline: none; margin-bottom: 0.9rem; transition: border-color 0.2s; }
    .login-input:focus { border-color: var(--verde); }
    .login-btn { width: 100%; background: var(--verde); border: none; border-radius: 8px; padding: 0.85rem; color: var(--negro); font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; cursor: pointer; transition: all 0.2s; margin-top: 0.3rem; }
    .login-btn:hover { background: #8fd11e; }
    .login-btn:disabled { opacity: 0.5; cursor: default; }
    .login-err { color: #ff6b6b; font-family: 'Space Mono', monospace; font-size: 0.65rem; margin-top: 0.8rem; }

    /* ── DASHBOARD ── */
    #dashboard { display: none; min-height: 100vh; }
    .adm-header { background: var(--negro); border-bottom: 1px solid rgba(124,181,24,0.12); padding: 0.9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; gap: 1rem; }
    .adm-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.08em; flex-shrink: 0; }
    .adm-logo span { color: var(--verde); }
    .adm-logo em { font-style: normal; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--gris); letter-spacing: 0.15em; margin-left: 0.5rem; vertical-align: middle; }
    .header-right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .btn-nueva { background: var(--verde); border: none; border-radius: 7px; padding: 0.5rem 1.1rem; color: var(--negro); font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-nueva:hover { background: #8fd11e; }
    .btn-logout { background: none; border: 1px solid rgba(124,181,24,0.25); color: var(--gris); padding: 0.4rem 0.85rem; border-radius: 6px; font-family: 'Space Mono', monospace; font-size: 0.6rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-logout:hover { border-color: var(--verde); color: var(--verde); }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: rgba(124,181,24,0.08); border-bottom: 1px solid rgba(124,181,24,0.08); }
    .stat-card { background: var(--negro); padding: 1.1rem; text-align: center; }
    .stat-n { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; color: var(--verde); line-height: 1; }
    .stat-label { font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; color: var(--gris); text-transform: uppercase; margin-top: 0.3rem; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid rgba(124,181,24,0.1); background: var(--negro); }
    .tab { flex: 1; background: none; border: none; padding: 1rem 0.5rem; font-family: 'Space Mono', monospace; font-size: 0.75rem; letter-spacing: 0.08em; color: var(--gris); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; text-transform: uppercase; }
    .tab.active { color: var(--verde); border-bottom-color: var(--verde); }
    .tab:hover:not(.active) { color: var(--crema); }

    /* Week tabs */
    .week-tabs { display: none; gap: 0.5rem; padding: 0.75rem 1rem; background: var(--bg2); border-bottom: 1px solid rgba(124,181,24,0.08); overflow-x: auto; }
    .week-tabs.visible { display: flex; }
    .day-tab { flex-shrink: 0; background: var(--bg3); border: 1.5px solid rgba(124,181,24,0.15); border-radius: 8px; padding: 0.6rem 1rem; font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--gris); cursor: pointer; transition: all 0.2s; text-align: center; line-height: 1.6; }
    .day-tab .dt-dia { font-size: 0.85rem; color: var(--crema); display: block; }
    .day-tab:hover:not(.active) { border-color: rgba(124,181,24,0.4); }
    .day-tab.active { border-color: var(--verde); background: var(--verde2); color: var(--verde); }
    .day-tab.active .dt-dia { color: var(--verde); }

    /* List */
    .list-header { padding: 1rem 1.5rem 0.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .list-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.05em; color: var(--crema); }
    .filter-sel { background: var(--bg3); border: 1px solid rgba(124,181,24,0.2); border-radius: 6px; padding: 0.5rem 0.8rem; color: var(--crema); font-family: 'Space Mono', monospace; font-size: 0.72rem; outline: none; cursor: pointer; }

    /* Cards */
    #reservasList { padding: 0.5rem 1rem 5rem; }
    .fecha-grupo { margin-bottom: 1.5rem; }
    .fecha-header { font-family: 'Space Mono', monospace; font-size: 0.75rem; letter-spacing: 0.1em; color: var(--verde); text-transform: uppercase; padding: 0.75rem 0.5rem 0.5rem; border-bottom: 1px solid rgba(124,181,24,0.12); margin-bottom: 0.6rem; }
    .reserva-card { background: var(--bg2); border: 1px solid rgba(124,181,24,0.1); border-radius: 12px; padding: 1.1rem 1.3rem; margin-bottom: 0.75rem; display: grid; grid-template-columns: auto 1fr auto; gap: 0 1rem; align-items: start; transition: border-color 0.2s; }
    .reserva-card:hover { border-color: rgba(124,181,24,0.25); }
    .card-hora { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--crema); letter-spacing: 0.05em; line-height: 1; padding-top: 0.1rem; min-width: 4.2rem; }
    .card-body { min-width: 0; }
    .card-servicio { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--verde); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.35rem; }
    .card-cliente { font-size: 1.25rem; font-weight: 600; color: var(--crema); margin-bottom: 0.2rem; }
    .card-tel { font-family: 'Space Mono', monospace; font-size: 0.75rem; color: rgba(242,237,215,0.65); }
    .card-tel a { color: inherit; text-decoration: none; }
    .card-tel a:hover { color: var(--verde); }
    .card-notas { font-size: 0.95rem; color: rgba(242,237,215,0.5); margin-top: 0.25rem; font-style: italic; }
    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }

    /* Estado — grande y con color de fondo sólido */
    .status-badge {
      font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 0.35rem 0.8rem; border-radius: 6px;
      font-weight: 700; white-space: nowrap;
    }
    .badge-pendiente  { background: rgba(200,136,42,0.25); color: #f5a623; border: 1.5px solid rgba(200,136,42,0.5); }
    .badge-confirmada { background: rgba(124,181,24,0.22); color: #9ad420; border: 1.5px solid rgba(124,181,24,0.5); }
    .badge-cancelada  { background: rgba(180,60,60,0.2);   color: #e06060; border: 1.5px solid rgba(180,60,60,0.45); }
    .badge-completada { background: rgba(74,143,212,0.2);  color: #6eb5f0; border: 1.5px solid rgba(74,143,212,0.45); }

    .card-actions { display: flex; flex-direction: column; gap: 0.35rem; align-items: flex-end; }
    .act-btn { background: none; border: 1.5px solid; border-radius: 6px; padding: 0.35rem 0.75rem; font-family: 'Space Mono', monospace; font-size: 0.65rem; cursor: pointer; white-space: nowrap; transition: all 0.15s; font-weight: 700; }
    .act-confirmar { border-color: rgba(124,181,24,0.5); color: #9ad420; }
    .act-confirmar:hover { background: rgba(124,181,24,0.15); }
    .act-cancelar   { border-color: rgba(220,80,80,0.5); color: #e06060; }
    .act-cancelar:hover { background: rgba(220,80,80,0.12); }
    .act-completar  { border-color: rgba(74,143,212,0.5); color: #6eb5f0; }
    .act-completar:hover { background: rgba(74,143,212,0.12); }
    .act-editar     { border-color: rgba(200,136,42,0.5); color: #f5a623; }
    .act-editar:hover { background: rgba(200,136,42,0.12); }
    .act-reactivar  { border-color: rgba(124,181,24,0.4); color: var(--verde); }
    .act-reactivar:hover { background: rgba(124,181,24,0.1); }
    .act-wa         { border-color: rgba(37,211,102,0.5); color: #25D366; text-decoration: none; display: inline-block; }
    .act-wa:hover   { background: rgba(37,211,102,0.1); }

    /* Empty / loading */
    .empty-msg { text-align: center; padding: 3rem 1rem; font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--gris); }
    .spinner { display: inline-block; width: 1.2rem; height: 1.2rem; border: 2px solid rgba(124,181,24,0.2); border-top-color: var(--verde); border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 0.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MODAL ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--bg2); border: 1px solid rgba(124,181,24,0.2); border-radius: 16px 16px 0 0; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 1.5rem 1.5rem 2rem; transform: translateY(40px); transition: transform 0.28s; }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .modal-titulo { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.06em; color: var(--crema); }
    .modal-close { background: none; border: 1px solid rgba(124,181,24,0.2); color: var(--gris); width: 2rem; height: 2rem; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .modal-close:hover { border-color: var(--verde); color: var(--verde); }
    .campo-grupo { margin-bottom: 1rem; }
    .campo-label { display: block; font-family: 'Space Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--gris); text-transform: uppercase; margin-bottom: 0.4rem; }
    .campo-input, .campo-select, .campo-textarea {
      width: 100%; background: var(--bg3); border: 1.5px solid rgba(124,181,24,0.18);
      border-radius: 7px; padding: 0.7rem 0.9rem; color: var(--crema);
      font-family: 'Crimson Pro', serif; font-size: 1rem; outline: none; transition: border-color 0.2s;
    }
    .campo-input:focus, .campo-select:focus, .campo-textarea:focus { border-color: var(--verde); }
    .campo-select option { background: var(--bg3); }
    .campo-textarea { resize: vertical; min-height: 70px; }
    .campos-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .modal-footer { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    .btn-guardar { flex: 1; background: var(--verde); border: none; border-radius: 7px; padding: 0.8rem; color: var(--negro); font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; transition: all 0.2s; }
    .btn-guardar:hover { background: #8fd11e; }
    .btn-guardar:disabled { opacity: 0.4; cursor: default; }
    .btn-cancelar-modal { background: none; border: 1px solid rgba(124,181,24,0.2); color: var(--gris); padding: 0.8rem 1.2rem; border-radius: 7px; font-family: 'Space Mono', monospace; font-size: 0.65rem; cursor: pointer; transition: all 0.2s; }
    .btn-cancelar-modal:hover { border-color: rgba(242,237,215,0.3); color: var(--crema); }
    .modal-error { color: #ff6b6b; font-family: 'Space Mono', monospace; font-size: 0.62rem; margin-top: 0.6rem; }

    /* Toast */
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid rgba(124,181,24,0.3); border-radius: 8px; padding: 0.7rem 1.4rem; font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--verde); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 999; white-space: nowrap; }
    .toast.show { opacity: 1; }

    /* Notificación nueva reserva */
    .notif-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: var(--verde); color: var(--negro);
      font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: 700;
      padding: 0.9rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      transform: translateY(-100%); transition: transform 0.35s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .notif-banner.show { transform: translateY(0); }
    .notif-banner button { background: rgba(0,0,0,0.15); border: none; border-radius: 5px; padding: 0.35rem 0.8rem; font-family: 'Space Mono', monospace; font-size: 0.7rem; font-weight: 700; color: var(--negro); cursor: pointer; }
    .notif-banner button:hover { background: rgba(0,0,0,0.25); }

    /* Agenda semanal */
    .agenda-nav { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; background: var(--bg2); border-bottom: 1px solid rgba(124,181,24,0.08); }
    .agenda-rango { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--crema); }
    .agenda-btn { background: none; border: 1px solid rgba(124,181,24,0.25); color: var(--gris); border-radius: 6px; padding: 0.35rem 0.8rem; font-family: 'Space Mono', monospace; font-size: 0.65rem; cursor: pointer; transition: all 0.2s; }
    .agenda-btn:hover { border-color: var(--verde); color: var(--verde); }
    .agenda-wrap { overflow-x: auto; padding: 0 1rem 4rem; }
    .agenda-grid { display: grid; min-width: 520px; border: 1px solid rgba(124,181,24,0.1); border-radius: 10px; overflow: hidden; }
    .agenda-head { display: grid; grid-template-columns: 3.5rem repeat(5,1fr) 0.85fr; background: var(--negro); border-bottom: 1px solid rgba(124,181,24,0.12); }
    .agenda-hcell { padding: 0.55rem 0.3rem; font-family: 'Space Mono', monospace; font-size: 0.6rem; color: var(--gris); text-align: center; text-transform: uppercase; letter-spacing: 0.08em; }
    .agenda-hcell.hoy-col { color: var(--verde); }
    .agenda-row { display: grid; grid-template-columns: 3.5rem repeat(5,1fr) 0.85fr; border-bottom: 1px solid rgba(124,181,24,0.06); }
    .agenda-row:last-child { border-bottom: none; }
    .agenda-time { padding: 0.4rem 0.3rem; font-family: 'Space Mono', monospace; font-size: 0.6rem; color: var(--gris); text-align: right; padding-right: 0.6rem; display: flex; align-items: center; justify-content: flex-end; background: var(--negro); }
    .agenda-cell { border-left: 1px solid rgba(124,181,24,0.06); min-height: 2.4rem; padding: 0.25rem; position: relative; }
    .agenda-cell.hoy-col { background: rgba(124,181,24,0.04); }
    .agenda-chip {
      background: rgba(124,181,24,0.15); border: 1px solid rgba(124,181,24,0.3);
      border-radius: 5px; padding: 0.2rem 0.35rem;
      font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--verde);
      cursor: pointer; line-height: 1.4; transition: background 0.15s;
    }
    .agenda-chip:hover { background: rgba(124,181,24,0.25); }
    .agenda-chip.pendiente  { background: rgba(200,136,42,0.15); border-color: rgba(200,136,42,0.35); color: #f5a623; }
    .agenda-chip.confirmada { background: rgba(124,181,24,0.15); border-color: rgba(124,181,24,0.35); color: #9ad420; }
    .agenda-chip.cancelada  { background: rgba(180,60,60,0.12);  border-color: rgba(180,60,60,0.3);  color: #e06060; }
    .agenda-chip.completada { background: rgba(74,143,212,0.15); border-color: rgba(74,143,212,0.35); color: #6eb5f0; }

    @media (max-width: 500px) {
      .reserva-card { grid-template-columns: auto 1fr; }
      .card-right { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; grid-column: 1/-1; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid rgba(124,181,24,0.08); }
      .card-actions { flex-direction: row; flex-wrap: wrap; }
      .campos-2col { grid-template-columns: 1fr; }
      .modal { border-radius: 14px 14px 0 0; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">WTJ<span>.</span></div>
    <div class="login-sub">Panel de Administración</div>
    <input class="login-input" id="loginEmail" type="email" placeholder="Email" autocomplete="email" />
    <input class="login-input" id="loginPass" type="password" placeholder="Contraseña" autocomplete="current-password" />
    <button class="login-btn" id="loginBtn" onclick="login()">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header class="adm-header">
    <div class="adm-logo">WTJ<span>.</span><em>ADMIN</em></div>
    <div class="header-right">
      <button class="btn-nueva" onclick="abrirModal()">+ Nueva reserva</button>
      <button class="btn-nueva" style="background:var(--oro);color:var(--negro);" onclick="abrirBloqueos()">✕ Días bloqueados</button>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-n" id="statTotal">—</div><div class="stat-label">Hoy</div></div>
    <div class="stat-card"><div class="stat-n" id="statPend">—</div><div class="stat-label">Pendientes</div></div>
    <div class="stat-card"><div class="stat-n" id="statConf">—</div><div class="stat-label">Confirmadas</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-vista="hoy"        onclick="setVista('hoy',this)">Hoy</button>
    <button class="tab"        data-vista="semana"     onclick="setVista('semana',this)">Semana</button>
    <button class="tab"        data-vista="proximas"   onclick="setVista('proximas',this)">Próximas</button>
    <button class="tab"        data-vista="stats"      onclick="setVista('stats',this)">Estadísticas</button>
  </div>

  <div class="week-tabs" id="weekTabs"></div>

  <!-- Agenda semanal (solo visible en vista semana) -->
  <div id="agendaWrap" style="display:none;">
    <div class="agenda-nav">
      <button class="agenda-btn" id="agendaPrev">← Semana anterior</button>
      <div class="agenda-rango" id="agendaRango"></div>
      <button class="agenda-btn" id="agendaNext">Semana siguiente →</button>
    </div>
    <div class="agenda-wrap">
      <div class="agenda-grid" id="agendaGrid"></div>
    </div>
  </div>

  <div class="list-header" id="listHeader" style="display:none;">
    <div class="list-title" id="listTitle">Reservas de hoy</div>
    <select class="filter-sel" id="filterEstado" onchange="aplicarFiltro()">
      <option value="">Todos</option>
      <option value="pendiente">Pendiente</option>
      <option value="confirmada">Confirmada</option>
      <option value="cancelada">Cancelada</option>
      <option value="completada">Completada</option>
    </select>
  </div>

  <div id="reservasList"></div>

  <!-- Vista estadísticas de ingresos -->
  <div id="statsWrap" style="display:none;"></div>
</div>

<!-- BANNER NUEVA RESERVA -->
<div class="notif-banner" id="notifBanner">
  <span id="notifTexto">🔔 Nueva reserva recibida</span>
  <button onclick="cerrarNotif()">Ver · Cerrar</button>
</div>

<!-- MODAL CREAR / EDITAR -->
<div class="modal-overlay" id="modalOverlay" onclick="cerrarModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-titulo" id="modalTitulo">Nueva reserva</div>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>

    <div class="campos-2col">
      <div class="campo-grupo">
        <label class="campo-label">Nombre cliente</label>

  function sonarNotif() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 150, 300].forEach((delay, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = [880, 1100, 1320][i];
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.18, ctx.currentTime + delay / 1000);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay / 1000 + 0.3);
        osc.start(ctx.currentTime + delay / 1000);
        osc.stop(ctx.currentTime + delay / 1000 + 0.3);
      });
    } catch(e) {}
  }

  async function renderAgenda() {

    const dias = ['Mar','Mié','Jue','Vie','Sáb'];

      const d = new Date(agendaLunes);
      d.setDate(agendaLunes.getDate() + i);
      fechas.push(d.toISOString().slice(0,10));
    }
    const sabado = new Date(agendaLunes); sabado.setDate(agendaLunes.getDate() + 6);
    fechas.push(sabado.toISOString().slice(0,10));
    const todosSlots = ['10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30'];
    const fechaInicio = fechas[0]; const fechaFin = fechas[fechas.length-1];
    const lunes  = new Date(agendaLunes); lunes.setDate(agendaLunes.getDate() + 1);
    const viernes = new Date(agendaLunes); viernes.setDate(agendaLunes.getDate() + 5);
    document.getElementById('agendaRango').textContent =

    const { data } = await db.from('reservas')

      .gte('fecha', fechaInicio).lte('fecha', fechaFin)
      .neq('estado','cancelada').order('hora');

    const mapaReservas = {};
    (data || []).forEach(r => {
      const key = r.fecha + '_' + r.hora.slice(0,5);
      if (!mapaReservas[key]) mapaReservas[key] = [];
      mapaReservas[key].push(r);

    const hoyStr = hoy();
    const diasHead = ['Mar','Mié','Jue','Vie','Vie','Sáb'];
    const diasNombres = ['Martes','Miércoles','Jueves','Viernes','Viernes','Sábado'];
    // 6 columnas: mar,mie,jue,vie,vie... wait, actually it should be Mar,Mié,Jue,Vie,Sáb — 5 días laborables + sábado = 6 cols
    // Let me redo: fechas[0]=mar, [1]=mie, [2]=jue, [3]=vie, [4]=sab  -- wait no
    // agendaLunes is Monday. +1=Tue,+2=Wed,+3=Thu,+4=Fri,+5=Sat
    // Actually I set fechas as [mar,mie,jue,vie,sab] (5 days), then pushed sabado again — let me fix
    // fechas = [mar, mie, jue, vie, ???, sab] — I had i from 1-5 (+sab separately)
    // i=1 = Tue, i=2=Wed, i=3=Thu, i=4=Fri, i=5=Sat, then pushed sab again => 6 items, wrong

    // Rebuild correct fechas
    const fechasOk = [];
    for (let i = 1; i <= 5; i++) {
      const d = new Date(agendaLunes);
      d.setDate(agendaLunes.getDate() + i);
      fechasOk.push({ iso: d.toISOString().slice(0,10), d });
    }
    const dNombres = ['MAR','MIÉ','JUE','VIE','SÁB'];
    // Slot filter per column (Sáb only morning)
    const slotsCol = (colIdx) => colIdx < 4
      ? ['10:00','10:30','11:00','11:30','12:00','12:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30']

  // ── ESTADÍSTICAS CABECERA ──

  // ── ESTADÍSTICAS DE INGRESOS ──
  async function cargarStatsIngresos() {
    const wrap = document.getElementById('statsWrap');
    wrap.innerHTML = '<div class="empty-msg"><div class="spinner"></div><br>Cargando estadísticas...</div>';

    const ahora = new Date();
    const y = ahora.getFullYear(), m = ahora.getMonth();
    const fmtMes = (yr, mo) => yr + '-' + String(mo+1).padStart(2,'0');
    const mesActual = fmtMes(y, m);
    const mesPrev   = fmtMes(m === 0 ? y-1 : y, m === 0 ? 11 : m-1);
    const inicio6m  = fmtMes(m < 5 ? y-1 : y, (m-5+12)%12) + '-01';

    const { data: raw, error } = await db.from('reservas')
      .select('id, estado, fecha, cliente_id, clientes(nombre), servicios(nombre, precio_desde)')
      .gte('fecha', inicio6m)
      .neq('estado', 'cancelada');

    if (error) { wrap.innerHTML = '<div class="empty-msg">Error al cargar estadísticas.</div>'; return; }
    const todo = raw || [];

    const getMes = d => d.slice(0,7);
    const precio = r => (r.servicios && r.servicios.precio_desde) ? Number(r.servicios.precio_desde) : 0;

    const rMes    = todo.filter(r => getMes(r.fecha) === mesActual);
    const rPrev   = todo.filter(r => getMes(r.fecha) === mesPrev);

    const ingresosReales   = rMes.filter(r => r.estado === 'completada').reduce((s,r) => s + precio(r), 0);
    const ingresosPrevistos = rMes.reduce((s,r) => s + precio(r), 0);
    const ingresosPrev     = rPrev.filter(r => r.estado === 'completada').reduce((s,r) => s + precio(r), 0);
    const completadasMes   = rMes.filter(r => r.estado === 'completada').length;
    const ticketMedio      = completadasMes > 0 ? Math.round(ingresosReales / completadasMes) : 0;

    let cambio = null;
    if (ingresosPrev > 0) cambio = Math.round(((ingresosReales - ingresosPrev) / ingresosPrev) * 100);

    // Por servicio
    const porSrv = {};
    rMes.forEach(r => {
      const n = r.servicios ? r.servicios.nombre : 'Sin servicio';
      if (!porSrv[n]) porSrv[n] = { count:0, total:0 };
      porSrv[n].count++;
      porSrv[n].total += precio(r);
    });
    const srvList = Object.entries(porSrv).sort((a,b) => b[1].total - a[1].total);
    const maxSrv  = srvList[0]?.[1]?.total || 1;

    // Tendencia 6 meses
    const meses6 = [];
    for (let i = 5; i >= 0; i--) {
      const mo = (m - i + 12) % 12, yr = m - i < 0 ? y - 1 : y;
      const key = fmtMes(yr, mo);
      const lbl = new Date(yr, mo, 1).toLocaleDateString('es', { month: 'short' });
      const ing = todo.filter(r => getMes(r.fecha) === key && r.estado === 'completada').reduce((s,r) => s + precio(r), 0);
      meses6.push({ key, lbl, ing });
    }
    const maxMes = Math.max(...meses6.map(x => x.ing), 1);

    // Top clientes
    const porCli = {};
    rMes.forEach(r => {
      const n = r.clientes ? r.clientes.nombre : 'Desconocido';
      if (!porCli[n]) porCli[n] = { citas:0, total:0 };
      porCli[n].citas++;
      porCli[n].total += precio(r);
    });
    const topCli = Object.entries(porCli).sort((a,b) => b[1].citas - a[1].citas).slice(0,5);

    const nomMes     = ahora.toLocaleDateString('es', { month: 'long', year: 'numeric' });
    const nomMesPrev = new Date(y, m-1, 1).toLocaleDateString('es', { month: 'long' });
    const camHtml    = cambio !== null
      ? `<div style="font-family:'Space Mono',monospace;font-size:0.63rem;margin-top:0.45rem;color:${cambio>=0?'#9ad420':'#e06060'};">
           ${cambio>=0?'▲':'▼'} ${Math.abs(cambio)}% vs ${nomMesPrev}
         </div>`
      : '';

    const kpi = (val, lbl, color) => `
      <div style="background:var(--bg2);border:1px solid rgba(124,181,24,0.13);border-radius:12px;padding:1.1rem;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:1;color:${color};">${val}</div>
        <div style="font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.08em;color:var(--gris);text-transform:uppercase;margin-top:0.3rem;">${lbl}</div>
      </div>`;

    const secTitulo = t => `<div style="font-family:'Space Mono',monospace;font-size:0.63rem;letter-spacing:0.12em;color:var(--verde);text-transform:uppercase;margin:1.6rem 0 0.8rem;padding-bottom:0.35rem;border-bottom:1px solid rgba(124,181,24,0.12);">${t}</div>`;

    wrap.innerHTML = `<div style="padding:1rem 1rem 5rem;">
      ${secTitulo(nomMes)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:0.2rem;">
        <div style="background:var(--bg2);border:1px solid rgba(124,181,24,0.2);border-radius:12px;padding:1.1rem;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:1;color:var(--crema);">${ingresosReales}€</div>
          <div style="font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.08em;color:var(--gris);text-transform:uppercase;margin-top:0.3rem;">Ingresos reales</div>
          ${camHtml}
        </div>
        <div style="background:var(--bg2);border:1px solid rgba(200,136,42,0.2);border-radius:12px;padding:1.1rem;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:1;color:var(--oro);">${ingresosPrevistos}€</div>
          <div style="font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.08em;color:var(--gris);text-transform:uppercase;margin-top:0.3rem;">Previsto total</div>
        </div>
        ${kpi(completadasMes, 'Completadas', 'var(--crema)')}
        ${kpi(ticketMedio + '€', 'Ticket medio', 'var(--crema)')}
      </div>

      ${secTitulo('Por servicio — este mes')}
      ${srvList.length === 0
        ? '<div style="font-family:\'Space Mono\',monospace;font-size:0.7rem;color:var(--gris);">Sin datos este mes.</div>'
        : srvList.map(([n, d]) => `
          <div style="display:flex;align-items:center;gap:0.7rem;margin-bottom:0.6rem;">
            <div style="font-family:'Crimson Pro',serif;font-size:0.9rem;color:var(--crema);min-width:9rem;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${n}">${n}</div>
            <div style="flex:1;height:7px;background:rgba(124,181,24,0.08);border-radius:4px;overflow:hidden;">
              <div style="height:100%;background:var(--verde);border-radius:4px;width:${Math.round((d.total/maxSrv)*100)}%;"></div>
            </div>
            <div style="font-family:'Space Mono',monospace;font-size:0.62rem;color:var(--gris);min-width:4.5rem;text-align:right;">${d.count} · ${d.total}€</div>
          </div>`).join('')}

      ${secTitulo('Tendencia (6 meses)')}
      <div style="display:flex;align-items:flex-end;gap:5px;height:72px;margin-bottom:4px;">
        ${meses6.map(mes => `
          <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;">
            <div title="${mes.ing}€" style="width:100%;background:${mes.key===mesActual?'var(--verde)':'rgba(124,181,24,0.28)'};border-radius:3px 3px 0 0;height:${mes.ing>0?Math.max(4,Math.round((mes.ing/maxMes)*68)):2}px;"></div>
          </div>`).join('')}
      </div>
      <div style="display:flex;gap:5px;margin-bottom:0.2rem;">
        ${meses6.map(mes => `
          <div style="flex:1;text-align:center;font-family:'Space Mono',monospace;font-size:0.5rem;color:${mes.key===mesActual?'var(--verde)':'var(--gris)'};text-transform:uppercase;">${mes.lbl}</div>`).join('')}
      </div>

      ${secTitulo('Top clientes — este mes')}
      ${topCli.length === 0
        ? '<div style="font-family:\'Space Mono\',monospace;font-size:0.7rem;color:var(--gris);">Sin datos este mes.</div>'
        : topCli.map(([n, d], i) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:0.55rem 0;border-bottom:1px solid rgba(124,181,24,0.06);">
            <div style="display:flex;align-items:center;gap:0.7rem;">
              <div style="font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--verde);min-width:1.2rem;">${i+1}</div>
              <div style="font-family:'Crimson Pro',serif;font-size:1rem;color:var(--crema);">${n}</div>
            </div>
            <div style="font-family:'Space Mono',monospace;font-size:0.62rem;color:var(--gris);">${d.citas} cita${d.citas>1?'s':''} · ${d.total}€</div>
          </div>`).join('')}
    </div>`;
  }

  // ── CARGAR RESERVAS ──
  async function cargarReservas() {
    if (vista === 'semana') return;
    const list = document.getElementById('reservasList');
    list.innerHTML = '<div class="empty-msg"><div class="spinner"></div><br>Cargando...</div>';
    let query = db.from('reservas')
      .select('*, servicios(nombre, duracion_minutos), clientes(nombre, telefono)');
    const titulo = document.getElementById('listTitle');
    if (vista === 'hoy') {
      query = query.eq('fecha', hoy()).order('hora');
      titulo.textContent = 'Reservas de hoy';
    } else {
      query = query.gte('fecha', hoy()).order('fecha').order('hora');
      titulo.textContent = 'Próximas reservas';
    }
    const { data, error } = await query;
    if (error) { list.innerHTML = '<div class="empty-msg">Error: ' + error.message + '</div>'; return; }
    todasReservas = data || [];
    renderLista();
  }

  window.aplicarFiltro = function() { renderLista(); };

  function renderLista() {
    const filtro = document.getElementById('filterEstado').value;
    const list = document.getElementById('reservasList');
    let datos = todasReservas;
    if (filtro) datos = datos.filter(r => r.estado === filtro);
    if (datos.length === 0) {
      list.innerHTML = '<div class="empty-msg">Sin reservas para mostrar.</div>';
      return;
    }
    if (vista === 'proximas') {
      list.innerHTML = '';
      const grupos = {};
      datos.forEach(r => { if (!grupos[r.fecha]) grupos[r.fecha] = []; grupos[r.fecha].push(r); });
      Object.keys(grupos).sort().forEach(fecha => {
        const d = new Date(fecha + 'T00:00:00');
        const label = d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
        const grp = document.createElement('div');
        grp.className = 'fecha-grupo';
        grp.innerHTML = '<div class="fecha-header">' + label.charAt(0).toUpperCase() + label.slice(1) + '</div>';
        grupos[fecha].forEach(r => grp.appendChild(crearCard(r)));
        list.appendChild(grp);
      });
    } else {
      list.innerHTML = '';
      datos.forEach(r => list.appendChild(crearCard(r)));
    }
  }

  function crearCard(r) {
    const card = document.createElement('div');
    card.className = 'reserva-card';
    card.id = 'card-' + r.id;
    const hora = r.hora ? r.hora.slice(0,5) : '—';
    const servicio = r.servicios ? r.servicios.nombre : '—';
    const duracion = r.servicios ? ' · ' + r.servicios.duracion_minutos + 'min' : '';
    const clienteNombre = r.clientes ? (r.clientes.nombre || 'Sin nombre') : 'Sin nombre';
    const clienteTel = r.clientes ? r.clientes.telefono : '';
    const badgeClass = 'badge-' + r.estado;

    let acciones = '<button class="act-btn act-editar" onclick="abrirModal(\'' + r.id + '\')">Editar</button>';
    if (r.estado === 'pendiente') {
      acciones += '<button class="act-btn act-confirmar" onclick="cambiarEstado(\'' + r.id + '\',\'confirmada\')">Confirmar</button>';
      acciones += '<button class="act-btn act-cancelar" onclick="cambiarEstado(\'' + r.id + '\',\'cancelada\')">Cancelar</button>';
    } else if (r.estado === 'confirmada') {
      acciones += '<button class="act-btn act-completar" onclick="cambiarEstado(\'' + r.id + '\',\'completada\')">Completada</button>';
      acciones += '<button class="act-btn act-cancelar" onclick="cambiarEstado(\'' + r.id + '\',\'cancelada\')">Cancelar</button>';
    } else if (r.estado === 'cancelada') {
      acciones += '<button class="act-btn act-reactivar" onclick="cambiarEstado(\'' + r.id + '\',\'pendiente\')">Reactivar</button>';
    }
    if ((r.estado === 'pendiente' || r.estado === 'confirmada') && clienteTel) {
      const waNum = (function(t){ const d=t.replace(/\D/g,''); return d.startsWith('34')?d:'34'+d; })(clienteTel);
      const fd = new Date(r.fecha + 'T00:00:00');
      const fl = fd.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
      const flCap = fl.charAt(0).toUpperCase() + fl.slice(1);
      const waMsg = encodeURIComponent('Hola ' + clienteNombre + '! Te recordamos tu cita en WTJ Barber Shop:\n✂ ' + servicio + '\n📅 ' + flCap + '\n🕐 ' + hora + '\n\n¡Te esperamos!');
      acciones += '<a class="act-btn act-wa" href="https://wa.me/' + waNum + '?text=' + waMsg + '" target="_blank" rel="noopener">📲 Recordar</a>';
    }

    card.innerHTML =
      '<div class="card-hora">' + hora + '</div>' +
      '<div class="card-body">' +
        '<div class="card-servicio">' + servicio + duracion + '</div>' +
        '<div class="card-cliente">' + clienteNombre + '</div>' +
        (clienteTel ? '<div class="card-tel"><a href="tel:' + clienteTel.replace(/\s/g,'') + '">' + clienteTel + '</a></div>' : '') +
        (r.notas ? '<div class="card-notas">' + r.notas + '</div>' : '') +
      '</div>' +
      '<div class="card-right">' +
        '<span class="status-badge ' + badgeClass + '">' + r.estado + '</span>' +
        '<div class="card-actions">' + acciones + '</div>' +
      '</div>';
    return card;
  }

  // ── CAMBIAR ESTADO RÁPIDO ──
  window.cambiarEstado = async function(id, nuevoEstado) {
    const { error } = await db.from('reservas').update({ estado: nuevoEstado }).eq('id', id);
    if (error) { mostrarToast('Error: ' + error.message); return; }
    todasReservas = todasReservas.map(r => r.id === id ? { ...r, estado: nuevoEstado } : r);
    renderLista();
    cargarEstadisticas();
    const labels = { confirmada: '✓ Confirmada', cancelada: '✗ Cancelada', completada: '✓ Completada', pendiente: '↺ Reactivada' };
    mostrarToast(labels[nuevoEstado] || nuevoEstado);
  };

  // ── MODAL ──
  window.abrirModal = function(id) {
    editandoId = id || null;
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalTitulo').textContent = id ? 'Editar reserva' : 'Nueva reserva';
    document.getElementById('modalError').textContent = '';

    // Rellenar select de servicios
    const sel = document.getElementById('mServicio');
    sel.innerHTML = '';
    serviciosData.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id;
      o.textContent = s.nombre + ' — ' + s.precio_desde + '€';
      sel.appendChild(o);
    });

    // Fecha por defecto: hoy
    document.getElementById('mFecha').value = hoy();
    actualizarHorasModal(hoy());

    const histWrap  = document.getElementById('mHistorialWrap');
    const histLista = document.getElementById('mHistorialLista');
    histWrap.style.display = 'none';
    histLista.innerHTML = '';

    if (id) {
      // Rellenar con datos existentes
      const r = todasReservas.find(x => x.id === id);
      if (r) {
        document.getElementById('mNombre').value   = r.clientes ? (r.clientes.nombre || '') : '';
        document.getElementById('mTelefono').value = r.clientes ? (r.clientes.telefono || '') : '';
        document.getElementById('mEstado').value   = r.estado;
        document.getElementById('mNotas').value    = r.notas || '';
        document.getElementById('mFecha').value    = r.fecha;
        actualizarHorasModal(r.fecha, r.hora ? r.hora.slice(0,5) : null);
        if (r.servicio_id) document.getElementById('mServicio').value = r.servicio_id;

        // Cargar historial del cliente en segundo plano
        if (r.cliente_id) {
          histWrap.style.display = 'block';
          histLista.innerHTML = '<div style="font-family:Space Mono,monospace;font-size:0.72rem;color:var(--gris);">Cargando...</div>';
          db.from('reservas')
            .select('id,fecha,hora,estado,servicios(nombre)')
            .eq('cliente_id', r.cliente_id)
            .neq('id', id)
            .order('fecha', { ascending: false })
            .limit(10)
            .then(({ data }) => {
              if (!data || data.length === 0) {
                histLista.innerHTML = '<div style="font-family:Space Mono,monospace;font-size:0.72rem;color:var(--gris);">Sin citas anteriores.</div>';
                return;
              }
              const badgeColors = { pendiente:'#C8882A', confirmada:'#7CB518', cancelada:'#c0392b', completada:'#2980b9' };
              histLista.innerHTML = data.map(h => {
                const d = new Date(h.fecha + 'T00:00:00');
                const fechaLabel = d.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                const horaLabel  = h.hora ? h.hora.slice(0,5) : '';
                const srvLabel   = h.servicios ? h.servicios.nombre : '—';
                const color      = badgeColors[h.estado] || '#888';
                return '<div style="display:flex;align-items:center;gap:0.6rem;padding:0.45rem 0;border-bottom:1px solid rgba(124,181,24,0.06);font-size:0.8rem;">' +
                  '<span style="font-family:Space Mono,monospace;color:var(--gris);min-width:5.5rem;font-size:0.7rem;">' + fechaLabel + '</span>' +
                  '<span style="font-family:Space Mono,monospace;color:var(--crema);min-width:2.5rem;">' + horaLabel + '</span>' +
                  '<span style="flex:1;color:var(--crema);">' + srvLabel + '</span>' +
                  '<span style="font-size:0.68rem;font-family:Space Mono,monospace;padding:0.15rem 0.5rem;border-radius:3px;background:' + color + '22;color:' + color + ';border:1px solid ' + color + '55;text-transform:uppercase;letter-spacing:0.05em;">' + h.estado + '</span>' +
                  '</div>';
              }).join('');
            });
        }
      }
    } else {
      document.getElementById('mNombre').value   = '';
      document.getElementById('mTelefono').value = '';
      document.getElementById('mEstado').value   = 'pendiente';
      document.getElementById('mNotas').value    = '';
    }

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.cerrarModal = function(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
    editandoId = null;
  };

  function actualizarHorasModal(fecha, horaActual) {
    const slots = slotsDelDia(fecha);
    const sel = document.getElementById('mHora');
    sel.innerHTML = '';
    if (slots.length === 0) {
      const o = document.createElement('option');
      o.textContent = 'Día cerrado'; sel.appendChild(o); return;
    }
    slots.forEach(h => {
      const o = document.createElement('option');
      o.value = h; o.textContent = h;
      if (h === horaActual) o.selected = true;
      sel.appendChild(o);
    });
  }

  document.getElementById('mFecha').addEventListener('change', function() {
    actualizarHorasModal(this.value);
  });

  // ── GUARDAR RESERVA (crear o editar) ──
  window.guardarReserva = async function() {
    const nombre   = document.getElementById('mNombre').value.trim();
    const telefono = document.getElementById('mTelefono').value.trim();
    const servicioId = document.getElementById('mServicio').value;
    const fecha    = document.getElementById('mFecha').value;
    const hora     = document.getElementById('mHora').value;
    const estado   = document.getElementById('mEstado').value;
    const notas    = document.getElementById('mNotas').value.trim();
    const errDiv   = document.getElementById('modalError');
    const btn      = document.getElementById('btnGuardar');

    errDiv.textContent = '';
    if (!nombre || !telefono || !fecha || !hora) {
      errDiv.textContent = 'Nombre, teléfono, fecha y hora son obligatorios.'; return;
    }

    btn.disabled = true; btn.textContent = 'Guardando...';

    // Obtener o crear cliente
    let clienteId;
    const { data: cliNew, error: cliInsErr } = await db.from('clientes')
      .insert({ telefono, nombre }).select('id').single();
    if (cliInsErr) {
      if (cliInsErr.code === '23505') {
        const { data: cliEx } = await db.from('clientes').select('id').eq('telefono', telefono).single();
        if (cliEx) {
          clienteId = cliEx.id;
          // Actualizar nombre si cambió
          await db.from('clientes').update({ nombre }).eq('id', clienteId);
        } else {
          errDiv.textContent = 'Error buscando cliente.';
          btn.disabled = false; btn.textContent = 'Guardar'; return;
        }
      } else {
        errDiv.textContent = 'Error cliente: ' + cliInsErr.message;
        btn.disabled = false; btn.textContent = 'Guardar'; return;
      }
    } else {
      clienteId = cliNew.id;
    }

    if (editandoId) {
      // EDITAR
      const { error } = await db.from('reservas').update({
        cliente_id: clienteId, servicio_id: servicioId,
        fecha, hora: hora + ':00', estado, notas: notas || null
      }).eq('id', editandoId);
      if (error) { errDiv.textContent = 'Error: ' + error.message; btn.disabled = false; btn.textContent = 'Guardar'; return; }
      mostrarToast('✓ Reserva actualizada');
    } else {
      // CREAR
      const { error } = await db.from('reservas').insert({
        cliente_id: clienteId, servicio_id: servicioId,
        fecha, hora: hora + ':00', estado, notas: notas || null
      });
      if (error) { errDiv.textContent = 'Error: ' + error.message; btn.disabled = false; btn.textContent = 'Guardar'; return; }
      mostrarToast('✓ Reserva creada');
    }

    btn.disabled = false; btn.textContent = 'Guardar';
    cerrarModal();
    cargarReservas();
    cargarEstadisticas();
  };

  // ── TOAST ──
  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── DÍAS BLOQUEADOS ──
  window.abrirBloqueos = function() {
    document.getElementById('bloqueosOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('bFecha').value = '';
    document.getElementById('bMotivo').value = '';
    cargarBloqueos();
  };

  window.cerrarBloqueos = function(e) {
    if (e && e.target !== document.getElementById('bloqueosOverlay')) return;
    document.getElementById('bloqueosOverlay').classList.remove('open');
    document.body.style.overflow = '';
  };

  async function cargarBloqueos() {
    const cont = document.getElementById('bloqueosList');
    cont.innerHTML = '<div style="color:var(--gris);font-family:Space Mono,monospace;font-size:0.7rem;">Cargando...</div>';
    const { data } = await db.from('dias_bloqueados').select('*').order('fecha');
    if (!data || data.length === 0) {
      cont.innerHTML = '<div style="color:var(--gris);font-family:Space Mono,monospace;font-size:0.7rem;">Sin días bloqueados.</div>';
      return;
    }
    cont.innerHTML = '';
    data.forEach(b => {
      const d = new Date(b.fecha + 'T00:00:00');
      const label = d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0;border-bottom:1px solid rgba(124,181,24,0.08);gap:0.5rem;';
      row.innerHTML =
        '<div><div style="font-size:1rem;color:var(--crema);">' + label.charAt(0).toUpperCase() + label.slice(1) + '</div>' +
        (b.motivo ? '<div style="font-family:Space Mono,monospace;font-size:0.6rem;color:var(--gris);">' + b.motivo + '</div>' : '') +
        '</div>' +
        '<button onclick="eliminarBloqueo(\'' + b.id + '\')" style="background:rgba(200,80,80,0.15);border:1px solid rgba(200,80,80,0.3);color:#e06060;border-radius:5px;padding:0.3rem 0.7rem;font-family:Space Mono,monospace;font-size:0.6rem;cursor:pointer;">Quitar</button>';
      cont.appendChild(row);
    });
  }

  window.agregarBloqueo = async function() {
    const fecha  = document.getElementById('bFecha').value;
    const motivo = document.getElementById('bMotivo').value.trim();
    if (!fecha) { mostrarToast('Elige una fecha'); return; }
    const { error } = await db.from('dias_bloqueados').insert({ fecha, motivo: motivo || null });
    if (error) { mostrarToast('Error: ' + (error.code === '23505' ? 'ese día ya está bloqueado' : error.message)); return; }
    mostrarToast('✓ Día bloqueado');
    document.getElementById('bFecha').value = '';
    document.getElementById('bMotivo').value = '';
    cargarBloqueos();
  };

  window.eliminarBloqueo = async function(id) {
    const { error } = await db.from('dias_bloqueados').delete().eq('id', id);
    if (error) { mostrarToast('Error: ' + error.message); return; }
    mostrarToast('✓ Día desbloqueado');
    cargarBloqueos();
  };

  // ── AUTO-REFRESH ──
  setInterval(() => { cargarEstadisticas(); cargarReservas(); }, 60000);
})();
</script>
</body>
</html>
